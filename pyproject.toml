[project]
name = "reporte-bot-admanager"
version = "0.1.0"
description = "Pipeline ETL que convierte los logs diarios del bot en la tabla de reporte tabla_reporte_bot."
readme = "README.md"
requires-python = ">=3.11"

# El pipeline corre unicamente con la libreria estandar de Python.
# Se evita pandas a proposito: la columna OFFICE es mixta ('0520' y
# 'Cedis 5687 Salinas') y al inferir tipos se perderia el cero a la izquierda.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# Solo para la exploracion en notebooks/, nunca para el pipeline.
notebooks = [
    "jupyter>=1.0",
    "pandas>=2.0",
]

[tool.uv]
# Proyecto "virtual": uv gestiona el entorno y las dependencias, pero no
# construye ni instala un paquete. El pipeline se ejecuta con `python -m src.main`.
package = false

# ---------------------------------------------------------------------------
# Ruff: linter y formateador
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort (orden de imports)
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # reglas propias de ruff
]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
